name: Build

on:
  workflow_call:

jobs:

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@40e4de17368d864bbd6f9810508abd31502b4bde # main
      - name: Run publishToMavenLocal
        run: ./gradlew :kpdfium:publishAndroidPublicationToMavenLocal :kpdfium:android:publishToMavenLocal
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: ~/.m2/repository/
          retention-days: 1

  ios-build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@40e4de17368d864bbd6f9810508abd31502b4bde # main
      - name: Run publishToMavenLocal
        run: >
          ./gradlew
          :kpdfium:publishIosArm64PublicationToMavenLocal
          :kpdfium:publishIosSimulatorArm64PublicationToMavenLocal
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: ~/.m2/repository/
          retention-days: 1


  native-binary-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-2022
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@40e4de17368d864bbd6f9810508abd31502b4bde # main
      - name: Run compileDesktopJni
        run: ./gradlew :kpdfium:compileDesktopJni
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: natives-${{ matrix.name }}
          path: kpdfium/src/jvmMain/resources/
          retention-days: 1

  jvm-build:
    needs: native-binary-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          github-api-token: ${{ secrets.GITHUB_TOKEN }}
          cmake-version: '4.1.2'
      - name: Setup Java and Gradle
        uses: SorrowBlue/github-actions/.github/actions/setup-java-gradle@40e4de17368d864bbd6f9810508abd31502b4bde # main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: natives-**
          path: kpdfium/src/jvmMain/resources/
          merge-multiple: true
      - name: Run publishToMavenLocal
        run: ./gradlew publishJvmPublicationToMavenLocal -x compileDesktopJni
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-allplatform
          path: ~/.m2/repository/
          retention-days: 1
